<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCB 随手记</title><link rel="stylesheet" href="/iframe/notes.css"><script defer src="/dist/notes.js"></script></head>
<body><header><strong>PCB 随手记</strong><span id="board-name"></span><details id="settings"><summary>设置</summary><label>整理服务 <select id="provider"><option value="local">本机服务</option><option value="deepseek">DeepSeek</option></select></label><button id="provider-check">检查连接</button><p id="provider-status"></p></details><button id="refresh">刷新</button><button id="close">返回 PCB</button></header>
<p id="status" role="status">正在读取…</p><section id="binding" hidden></section><section id="recovery" hidden></section>
<main><aside><div class="row"><button id="new" class="primary">新建便签</button><button id="history">历史便签本</button></div><input id="search" placeholder="搜索记录或对象"><select id="filter"><option value="">全部状态</option><option>待确认</option><option>已处理</option><option>已归档</option></select><div id="list"></div><div class="actions"><button id="handoff">整理交接</button><button id="template">按原文导出</button></div><details><summary>整理进度</summary><div id="jobs"></div></details></aside>
<section id="detail"><div id="editor" hidden><input id="title" placeholder="标题（可选）" maxlength="200"><p id="objects" class="muted"></p><textarea id="body" placeholder="记下当前观察、计划或需要交接的事…" maxlength="12000"></textarea><div class="row"><button id="save" class="primary">保存</button><button id="polish">整理文字</button><button id="append">追加进展</button><button id="select">在板上选择</button></div><div class="row"><label>图片附件<input id="file" type="file" accept="image/png,image/jpeg"></label><span class="muted">也可直接粘贴图片</span></div><div id="attachments"></div><div id="entries"></div><details><summary>更多</summary><button id="link-selection">关联当前选中对象</button><button id="state">标为已处理</button><button id="archive">归档记录</button><button id="sharing">停止分享</button><div id="versions"></div></details></div>
<section id="preview" hidden></section><p id="empty">选择一条便签，或新建记录。</p></section></main></body></html>
